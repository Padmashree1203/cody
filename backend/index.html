  <style>
/* Cody - warm "golden hour tide pool" theme. Light first, dark umber second. */
:root {
  --bg: #FBF1E3; --paper: #FFF8EC; --sand: #F5E4CC; --line: #E8D4B6;
  --ink: #2B1810; --ink2: #6B5242;
  --clay: #C8553D; --marigold: #F2A93B; --rose: #E39A8B; --olive: #7C8B47; --ochre: #C98A2E; --plum: #8C5A7A;
  --btn-bg: #B84A33; --btn-ink: #FFF8EC; --good: #5F6E2E; --bad: #B84A33;
  --user-bg: #F6D6C2; --cody-bg: #FFF8EC;
  --shadow: 0 14px 34px -16px rgba(94, 45, 20, .45); --shadow-s: 0 4px 14px -8px rgba(94, 45, 20, .4);
  --otter-water: rgba(242, 169, 59, .55); --otter-water2: rgba(200, 85, 61, .38);
  --f-head: "Fraunces", Georgia, "Times New Roman", serif;
  --f-body: "Figtree", system-ui, -apple-system, "Segoe UI", sans-serif;
  --f-hand: "Caveat", "Segoe Print", "Bradley Hand", cursive;
  --top: 64px; --dock: 96px;
}
[data-theme="dark"] {
  --bg: #1F120D; --paper: #2A1A13; --sand: #38241A; --line: #4D3427;
  --ink: #F7E8D2; --ink2: #C2A88F;
  --clay: #E0704F; --marigold: #F5B54E; --rose: #E8A598; --olive: #A3B166; --ochre: #E0A64A; --plum: #B58AA5;
  --btn-bg: #F5B54E; --btn-ink: #2B1810; --good: #A3B166; --bad: #F08A6C;
  --user-bg: #5A2E22; --cody-bg: #2A1A13;
  --shadow: 0 14px 34px -16px rgba(0, 0, 0, .7); --shadow-s: 0 4px 14px -8px rgba(0, 0, 0, .7);
  --otter-water: rgba(245, 181, 78, .4); --otter-water2: rgba(224, 112, 79, .35);
}

*, *::before, *::after { box-sizing: border-box; }
[hidden] { display: none !important; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0; min-height: 100dvh; background: var(--bg); color: var(--ink);
  font: 400 16px/1.55 var(--f-body); -webkit-font-smoothing: antialiased;
  background-image: radial-gradient(1200px 500px at 85% -10%, color-mix(in srgb, var(--marigold) 14%, transparent), transparent 70%),
                    radial-gradient(900px 500px at -10% 110%, color-mix(in srgb, var(--clay) 10%, transparent), transparent 70%);
  background-attachment: fixed;
}
h1, h2, h3, h4 { font-family: var(--f-head); font-weight: 700; line-height: 1.15; margin: 0 0 .4em; letter-spacing: -.01em; }
p { margin: 0 0 .7em; }
button { font: inherit; color: inherit; cursor: pointer; }
input, select, textarea { font: inherit; color: inherit; }
:focus-visible { outline: 3px solid color-mix(in srgb, var(--marigold) 85%, transparent); outline-offset: 2px; border-radius: 8px; }
.hand { font-family: var(--f-hand); font-size: 1.35em; line-height: 1.15; font-weight: 500; }
.sub { color: var(--ink2); font-size: .92rem; }
.err { color: var(--bad); font-weight: 500; }
.center { text-align: center; }
.label { display: block; font: 700 11px/1 var(--f-body); letter-spacing: .12em; text-transform: uppercase; color: var(--ink2); margin: 0 0 8px; }
.link { background: none; border: 0; color: var(--clay); font-weight: 600; text-decoration: underline; text-underline-offset: 3px; padding: 4px; }
.ico { flex: none; vertical-align: middle; }

/* ------------------------------------------------------------ buttons */
.btn, .google-btn, .door, .scn, .opt, .lv, .style { position: relative; overflow: hidden; }
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 8px; padding: 11px 20px; border-radius: 999px;
  border: 1.5px solid transparent; font-weight: 600; transition: transform .2s, box-shadow .2s, background .2s; white-space: nowrap;
}
.btn.primary { background: var(--btn-bg); color: var(--btn-ink); box-shadow: 0 8px 18px -10px var(--btn-bg); }
.btn.primary:hover:not(:disabled) { transform: translateY(-2px); }
.btn.ghost { background: transparent; border-color: var(--line); color: var(--ink); }
.btn.ghost:hover:not(:disabled) { background: var(--sand); }
.btn.danger { color: var(--bad); border-color: color-mix(in srgb, var(--bad) 40%, transparent); }
.btn.sm { padding: 7px 14px; font-size: .88rem; }
.btn.block { width: 100%; }
.btn:disabled { opacity: .5; cursor: not-allowed; }
.icon-btn { display: inline-grid; place-items: center; width: 42px; height: 42px; border-radius: 50%; border: 0; background: transparent; color: var(--ink); transition: background .2s, transform .2s; flex: none; }
.icon-btn:hover { background: var(--sand); }
.rip { position: absolute; width: 10px; height: 10px; margin: -5px 0 0 -5px; border-radius: 50%; background: currentColor; opacity: .28; pointer-events: none; animation: rip .7s ease-out forwards; }
@keyframes rip { to { transform: scale(26); opacity: 0; } }
.lean { transition: transform .25s ease-out, box-shadow .25s; transform: perspective(700px) rotateX(var(--rx, 0deg)) rotateY(var(--ry, 0deg)) translateY(var(--ty, 0px)); }

/* ---------------------------------------------------------------- chips */
.chip { --c: var(--ink2); display: inline-block; padding: 2px 10px; border-radius: 99px; font-size: 12px; font-weight: 700; letter-spacing: .02em;
  color: color-mix(in srgb, var(--c) 72%, var(--ink)); background: color-mix(in srgb, var(--c) 15%, transparent); border: 1px solid color-mix(in srgb, var(--c) 38%, transparent); }
.chip-btn { border: 1.5px solid var(--line); background: var(--paper); border-radius: 999px; padding: 7px 14px; font-size: .92rem; transition: background .2s, border-color .2s, transform .2s; }
.chip-btn:hover { background: var(--sand); transform: translateY(-1px); }
.chip-btn.on { background: var(--btn-bg); color: var(--btn-ink); border-color: transparent; }
.chips { display: flex; flex-wrap: wrap; gap: 8px; margin: 10px 0; }
.chips.big { justify-content: center; gap: 10px; margin: 18px 0; }
.chips.big .chip-btn { padding: 10px 18px; font-size: 1rem; }
.badge { display: inline-block; padding: 2px 10px; border-radius: 99px; background: var(--sand); font-size: 12px; font-weight: 700; color: var(--ink2); }
.badge.due { background: var(--marigold); color: #2B1810; }

/* --------------------------------------------------------------- boot */
.boot { position: fixed; inset: 0; z-index: 90; display: grid; place-content: center; justify-items: center; gap: 8px; background: var(--bg); text-align: center; padding: 24px; }
.boot .otter { width: 220px; color: var(--ink2); }
.boot p { font-family: var(--f-hand); font-size: 28px; color: var(--ink2); }
.boot small { font: 400 .9rem var(--f-body); }

/* -------------------------------------------------------------- otter */
.otter { display: block; width: 100%; height: auto; overflow: hidden; -webkit-mask-image: linear-gradient(to bottom, #000 58%, transparent 96%); mask-image: linear-gradient(to bottom, #000 58%, transparent 96%); }
.otter-bob { animation: bob 5.5s ease-in-out infinite; transform-origin: 130px 104px; }
@keyframes bob { 0%, 100% { transform: translateY(0) rotate(-.7deg); } 50% { transform: translateY(-5px) rotate(.9deg); } }
.otter-water { animation: drift48 5s linear infinite; }
.otter-water.two { animation: drift60 8s linear infinite reverse; }
@keyframes drift48 { to { transform: translateX(-48px); } }
@keyframes drift60 { to { transform: translateX(-60px); } }
.blink { animation: blink 6s infinite; transform-box: fill-box; transform-origin: center; }
@keyframes blink { 0%, 94%, 100% { transform: scaleY(1); } 96% { transform: scaleY(.1); } }
.otter:not(.sleep) .eyes-closed, .otter.sleep .eyes-open { display: none; }
.zzz { opacity: 0; animation: zzz 3.6s ease-in-out infinite; }
.zzz.z2 { animation-delay: 1.2s; }
@keyframes zzz { 0% { opacity: 0; transform: translateY(8px); } 40% { opacity: .9; } 100% { opacity: 0; transform: translateY(-10px); } }
.otter.small { width: 150px; margin: 0 auto; }
.otter-face { flex: none; }

/* ------------------------------------------------------------- login */
.login { position: fixed; inset: 0; z-index: 50; display: grid; place-items: center; padding: 20px; overflow: hidden; color: #FFF4E0; background: #2A120D; }
.water-fallback { position: absolute; inset: 0; background: radial-gradient(900px 420px at 30% 20%, rgba(255, 201, 112, .55), transparent 70%), radial-gradient(700px 420px at 80% 70%, rgba(232, 128, 58, .5), transparent 70%), linear-gradient(180deg, #D8733A 0%, #7A2E1E 55%, #2A120D 100%); background-size: 140% 140%; animation: shimmer 18s ease-in-out infinite alternate; }
@keyframes shimmer { to { background-position: 100% 100%; } }
#water-login, #heroWater { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
.login-card { position: relative; width: min(92vw, 440px); padding: 26px 32px 28px; text-align: center; border-radius: 34px; background: rgba(42, 18, 13, .42); border: 1px solid rgba(255, 214, 160, .3);
  -webkit-backdrop-filter: blur(16px) saturate(1.25); backdrop-filter: blur(16px) saturate(1.25); box-shadow: 0 30px 80px -30px rgba(0, 0, 0, .7), inset 0 1px 0 rgba(255, 233, 200, .25); will-change: transform; }
.login-otter { width: 230px; margin: -6px auto 0; will-change: transform; }
.login-otter .otter { --otter-water: rgba(255, 190, 110, .55); --otter-water2: rgba(232, 128, 58, .45); }
.login h1 { font-size: 2.5rem; margin: 6px 0 10px; color: #FFF4E0; }
.login h1 em { color: #FFC970; font-style: italic; }
.login .lead { color: rgba(255, 244, 224, .86); font-size: 1.02rem; max-width: 34ch; margin: 0 auto 22px; }
.google-btn { display: inline-flex; align-items: center; justify-content: center; gap: 12px; width: 100%; padding: 14px 22px; border: 0; border-radius: 999px; background: #FFF4E0; color: #2B1810; font-weight: 700; font-size: 1.02rem; box-shadow: 0 14px 30px -14px rgba(0, 0, 0, .8); transition: transform .2s; }
.google-btn:hover:not(:disabled) { transform: translateY(-2px); }
.google-btn:disabled { opacity: .6; cursor: not-allowed; }
.login-err { margin: 14px 0 0; padding: 10px 14px; border-radius: 14px; background: rgba(184, 74, 51, .4); font-size: .9rem; }
.fine { margin: 16px 0 0; font-size: .82rem; color: rgba(255, 244, 224, .65); }
.login.no-gl #water-login { display: none; }

/* -------------------------------------------------------------- shell */
.topbar { position: sticky; top: 0; z-index: 30; height: var(--top); display: flex; align-items: center; justify-content: space-between; padding: 0 clamp(14px, 3vw, 32px);
  background: color-mix(in srgb, var(--bg) 82%, transparent); -webkit-backdrop-filter: blur(12px); backdrop-filter: blur(12px); border-bottom: 1px solid color-mix(in srgb, var(--line) 60%, transparent); }
.brand { display: flex; align-items: center; gap: 10px; background: none; border: 0; padding: 0; font: 700 1.55rem var(--f-head); }
.top-actions { display: flex; align-items: center; gap: 4px; }
.streak-btn { display: inline-flex; align-items: center; gap: 6px; padding: 6px 12px; border: 0; border-radius: 999px; background: var(--sand); font-weight: 700; }
.streak-btn .drop, .streak-pill .drop { color: var(--clay); }
.view { padding: 18px clamp(14px, 3vw, 32px) calc(var(--dock) + 24px); max-width: 1180px; margin: 0 auto; animation: viewIn .4s ease-out; }
@keyframes viewIn { from { opacity: 0; transform: translateY(8px); } }
.dock { position: fixed; z-index: 35; left: 50%; bottom: max(14px, env(safe-area-inset-bottom)); transform: translateX(-50%); display: flex; gap: 2px; padding: 7px; border-radius: 999px;
  background: color-mix(in srgb, var(--paper) 88%, transparent); -webkit-backdrop-filter: blur(14px); backdrop-filter: blur(14px); border: 1px solid var(--line); box-shadow: var(--shadow); }
.dock button { position: relative; display: grid; justify-items: center; gap: 1px; min-width: 62px; padding: 8px 10px 6px; border: 0; border-radius: 999px; background: none; color: var(--ink2); font-size: .72rem; font-weight: 600; transition: color .2s, background .2s; }
.dock button:hover { background: var(--sand); }
.dock button[aria-current] { color: var(--ink); background: var(--sand); }
.dock button[aria-current]::after { content: ""; position: absolute; inset: 2px; border-radius: 999px; border: 2px solid var(--marigold); animation: ring 2.8s ease-out infinite; pointer-events: none; }
@keyframes ring { 0% { transform: scale(.92); opacity: .9; } 100% { transform: scale(1.14); opacity: 0; } }

/* -------------------------------------------------------- page / cards */
.page-head { margin: 6px 0 18px; }
.page-head h2 { font-size: clamp(1.8rem, 4vw, 2.4rem); }
.page-head p { color: var(--ink2); max-width: 60ch; }
.card { background: var(--paper); border: 1px solid var(--line); border-radius: 26px; padding: 22px; box-shadow: var(--shadow-s); }
.card h3 { font-size: 1.2rem; }
.card-head { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-bottom: 8px; }
.grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 18px; margin-top: 18px; }
.two-col { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 18px; margin-bottom: 18px; }
.empty { text-align: center; padding: 10px 0; }
.empty .otter { width: 170px; margin: 0 auto 8px; color: var(--ink2); }
.empty .glass { width: 90px; margin: 0 auto; display: block; }
.seg { display: inline-flex; padding: 4px; border-radius: 999px; background: var(--sand); margin-bottom: 16px; gap: 2px; }
.seg button { border: 0; background: none; padding: 8px 16px; border-radius: 999px; font-weight: 600; color: var(--ink2); }
.seg button.on { background: var(--paper); color: var(--ink); box-shadow: var(--shadow-s); }
.seg.big button { padding: 10px 26px; }

/* ----------------------------------------------------------- today */
.hero { position: relative; display: flex; align-items: center; min-height: 270px; padding: clamp(22px, 4vw, 42px); border-radius: 34px; overflow: hidden; color: #2B1810; box-shadow: var(--shadow); isolation: isolate; }
.hero .water-fallback { background: linear-gradient(135deg, #F3B07A, #E98D5C); }
[data-theme="dark"] .hero { color: #F7E8D2; }
[data-theme="dark"] .hero .water-fallback { background: linear-gradient(135deg, #5A2519, #1E0F0B); }
.hero-copy { position: relative; z-index: 2; max-width: 520px; }
.hero h1 { font-size: clamp(1.9rem, 4.6vw, 3rem); margin: 0 0 18px; }
.greet { font-size: 1.9rem; margin: 0 0 4px; opacity: .9; }
.hero-row { display: flex; flex-wrap: wrap; align-items: center; gap: 14px; }
.streak-pill { display: inline-flex; align-items: center; gap: 6px; padding: 8px 14px; border-radius: 999px; background: rgba(255, 248, 236, .75); color: #2B1810; font-weight: 700; }
[data-theme="dark"] .streak-pill { background: rgba(42, 26, 19, .7); color: #F7E8D2; }
.hero-otter { position: absolute; right: clamp(8px, 4%, 48px); bottom: -8px; width: min(310px, 36%); z-index: 2; pointer-events: none; }
.steps { list-style: none; margin: 8px 0 0; padding: 0; display: grid; gap: 8px; }
.steps button { display: flex; align-items: center; gap: 14px; width: 100%; text-align: left; padding: 10px 12px; border-radius: 18px; border: 1px solid var(--line); background: var(--bg); transition: transform .2s, background .2s; }
.steps button:hover { transform: translateX(3px); background: var(--sand); }
.steps small { display: block; color: var(--ink2); }
.tick { display: grid; place-items: center; width: 30px; height: 30px; border-radius: 50%; border: 2px solid var(--line); font-weight: 700; flex: none; }
.steps .done .tick { background: var(--olive); border-color: var(--olive); color: #fff; }
.steps .done b { text-decoration: line-through; text-decoration-color: var(--olive); }
.doors { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; }
.door { display: grid; align-content: start; gap: 4px; text-align: left; padding: 16px; border-radius: 20px; border: 1px solid var(--line); background: var(--bg); }
.door .ico { color: var(--clay); margin-bottom: 4px; }
.door b { font: 700 1.1rem var(--f-head); }
.door small { color: var(--ink2); line-height: 1.3; }
.tip { background: color-mix(in srgb, var(--marigold) 22%, var(--paper)); background-image: repeating-linear-gradient(transparent 0 31px, rgba(0, 0, 0, .05) 31px 32px); }
.tip-text { font-size: 1.7rem; margin: 0; }
.glasses { display: flex; gap: 16px; align-items: flex-end; padding-top: 6px; overflow-x: auto; }
.g-col { display: grid; justify-items: center; gap: 6px; min-width: 56px; }
.g-col small { font-size: .72rem; color: var(--ink2); text-align: center; max-width: 70px; line-height: 1.15; }
.g-glass { position: relative; width: 44px; height: 112px; border: 2.5px solid var(--ink); border-radius: 6px 6px 16px 16px; overflow: hidden; background: color-mix(in srgb, var(--paper) 60%, transparent); }
.g-glass i { position: absolute; left: 0; right: 0; bottom: 0; background: var(--c); transition: height 1s; }
.g-glass i::before { content: ""; position: absolute; left: -10%; right: -10%; top: -5px; height: 10px; border-radius: 50%; background: var(--c); animation: sway 3s ease-in-out infinite alternate; }
@keyframes sway { to { transform: translateX(8%) scaleY(1.2); } }

/* ----------------------------------------------------------- chat */
.view[data-view="talk"], .view[data-view="roleplay"] { padding-bottom: calc(var(--dock) + 10px); }
.chat-wrap { display: grid; grid-template-columns: minmax(0, 1fr) 350px; gap: 18px; height: calc(100dvh - var(--top) - var(--dock) - 28px); min-height: 460px; }
.chat-main { display: flex; flex-direction: column; min-height: 0; background: var(--paper); border: 1px solid var(--line); border-radius: 28px; box-shadow: var(--shadow-s); overflow: hidden; }
.chat-head { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 12px 16px; border-bottom: 1px solid var(--line); flex-wrap: wrap; }
.who { display: flex; align-items: center; gap: 12px; }
.who strong { display: block; font: 700 1.1rem var(--f-head); line-height: 1.1; }
.chat-actions { display: flex; gap: 8px; align-items: center; }
.notes-toggle { display: none; }
.notes-toggle b { background: var(--marigold); color: #2B1810; border-radius: 99px; padding: 0 7px; font-size: .75rem; }
.scene { padding: 8px 16px; font-size: .88rem; background: color-mix(in srgb, var(--marigold) 18%, var(--paper)); border-bottom: 1px solid var(--line); }
.scene span { margin: 0 4px; opacity: .5; }
.stream { flex: 1; overflow-y: auto; padding: 8px 18px 16px; scroll-behavior: smooth; }
.msg { display: flex; align-items: flex-end; gap: 10px; margin: 14px 0; animation: pop .3s ease-out; }
@keyframes pop { from { opacity: 0; transform: translateY(8px) scale(.98); } }
.msg.user { flex-direction: column; align-items: flex-end; gap: 4px; }
.bubble { max-width: min(80%, 560px); padding: 12px 17px; font-size: 1.04rem; line-height: 1.5; overflow-wrap: anywhere; }
.msg.cody .bubble { background: var(--sand); border-radius: 24px 24px 24px 8px / 22px 22px 22px 10px; }
.msg.user .bubble { background: var(--user-bg); border-radius: 24px 24px 8px 24px / 22px 22px 10px 24px; }
.msg .say { opacity: .55; width: 34px; height: 34px; }
.msg .say:hover { opacity: 1; }
.w { background: none; border: 0; padding: 0; margin: 0; font: inherit; color: inherit; cursor: pointer; border-radius: 4px; }
.w:hover { background: color-mix(in srgb, var(--marigold) 35%, transparent); text-decoration: underline dotted; text-underline-offset: 3px; }
.fixmark { background: color-mix(in srgb, var(--marigold) 30%, transparent); text-decoration: underline wavy var(--clay); text-decoration-thickness: 1.5px; text-underline-offset: 4px; border-radius: 4px; cursor: pointer; }
.msg-meta { min-height: 18px; font-size: .8rem; }
.note-chip { border: 0; border-radius: 99px; padding: 2px 10px; background: var(--marigold); color: #2B1810; font-weight: 700; font-size: .78rem; }
.clean { color: var(--good); font-weight: 600; display: inline-flex; align-items: center; gap: 4px; }
.held { color: var(--ink2); font-style: italic; }
.dots { display: inline-flex; gap: 5px; padding: 6px 2px; }
.dots i { width: 8px; height: 8px; border-radius: 50%; background: var(--ink2); animation: dot 1.2s ease-in-out infinite; }
.dots i:nth-child(2) { animation-delay: .15s; } .dots i:nth-child(3) { animation-delay: .3s; }
@keyframes dot { 0%, 80%, 100% { transform: translateY(0); opacity: .4; } 40% { transform: translateY(-6px); opacity: 1; } }
.starters { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin: 10px 0 0 46px; }
.composer { padding: 10px 14px 14px; border-top: 1px solid var(--line); }
.left-count { font-size: .76rem; color: var(--ink2); text-align: right; margin: 0 6px 6px; }
.composer-row { display: flex; align-items: flex-end; gap: 8px; background: var(--bg); border: 1.5px solid var(--line); border-radius: 26px; padding: 6px; transition: border-color .2s, box-shadow .2s; }
.composer-row:focus-within { border-color: var(--marigold); box-shadow: 0 0 0 4px color-mix(in srgb, var(--marigold) 25%, transparent); }
.composer textarea { flex: 1; resize: none; border: 0; background: none; outline: none; padding: 10px 4px; max-height: 140px; line-height: 1.4; }
.composer .mic { color: var(--clay); }
.send { width: 44px; height: 44px; border-radius: 50%; border: 0; background: var(--btn-bg); color: var(--btn-ink); display: grid; place-items: center; flex: none; transition: transform .2s; }
.send:hover:not(:disabled) { transform: scale(1.07) rotate(-6deg); }
.send:disabled { opacity: .45; }

/* ---- Coach Margin */
.margin { min-height: 0; overflow-y: auto; padding: 16px; border-radius: 28px; border: 1px solid var(--line); border-left: 3px solid color-mix(in srgb, var(--clay) 50%, transparent);
  background: var(--sand); background-image: repeating-linear-gradient(transparent 0 31px, color-mix(in srgb, var(--ink) 6%, transparent) 31px 32px); box-shadow: var(--shadow-s); }
.margin-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 8px; }
.margin-head h3 { font-size: 1.9rem; margin: 0; color: var(--clay); }
.margin-head .icon-btn { display: none; }
.margin-empty { text-align: center; padding: 24px 6px; color: var(--ink2); }
.margin-empty .hand { font-size: 1.45rem; }
.held-note { color: var(--ink2); }
.note { position: relative; background: var(--paper); border: 1px solid var(--line); border-radius: 18px; padding: 16px 14px 14px; margin: 14px 0; box-shadow: var(--shadow-s); animation: pop .35s ease-out; }
.note::before { content: ""; position: absolute; top: -9px; left: 50%; width: 54px; height: 16px; margin-left: -27px; background: color-mix(in srgb, var(--marigold) 55%, transparent); border-radius: 3px; transform: rotate(-2deg); }
.note.flash { animation: flash 1.2s; }
@keyframes flash { 30% { box-shadow: 0 0 0 5px color-mix(in srgb, var(--marigold) 60%, transparent); } }
.note-src { color: var(--ink2); font-size: .88rem; font-style: italic; margin-bottom: 10px; }
.fix { padding: 8px 0; border-top: 1px dashed var(--line); }
.fix:first-of-type { border-top: 0; padding-top: 0; }
.fix-line { display: flex; flex-wrap: wrap; align-items: baseline; gap: 8px; margin-bottom: 4px; font-weight: 600; }
.was { text-decoration: line-through; text-decoration-color: var(--clay); color: var(--bad); }
.now { color: var(--good); font-weight: 700; }
.arrow { color: var(--ink2); }
.rule { margin: 4px 0 0; color: var(--ink2); font-size: 1.3rem; }
.better { margin-top: 10px; padding: 10px 12px; border-radius: 14px; background: color-mix(in srgb, var(--marigold) 20%, var(--paper)); }
.better p { margin: 2px 0 8px; font-weight: 500; }
.row, .row-btns { display: flex; flex-wrap: wrap; gap: 8px; }
.note.words .wchips { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 8px; }
.wmeans { list-style: none; padding: 0; margin: 0 0 10px; font-size: .88rem; color: var(--ink2); }
.wmeans li { margin: 3px 0; } .wmeans b { color: var(--ink); }

/* ---- roleplay picker */
.scn-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 16px; }
.scn { --h: var(--clay); text-align: left; padding: 20px; border-radius: 24px; border: 1px solid var(--line); background: linear-gradient(160deg, color-mix(in srgb, var(--h) 22%, var(--paper)), var(--paper) 70%); box-shadow: var(--shadow-s); display: grid; gap: 6px; align-content: start; }
.scn h3 { margin: 4px 0 0; font-size: 1.25rem; }
.scn p { margin: 0; color: var(--ink2); }
.scn small { color: var(--ink2); line-height: 1.3; margin-top: 6px; border-top: 1px dashed var(--line); padding-top: 8px; }
.lvl { justify-self: start; font-weight: 700; font-size: .75rem; padding: 2px 10px; border-radius: 99px; background: var(--h); color: #fff; }
[data-theme="dark"] .lvl { color: #2B1810; }

/* ---- recap + summary */
.recap { list-style: none; margin: 8px 0; padding: 0; display: grid; gap: 10px; }
.recap li { padding: 10px 12px; border-radius: 14px; background: var(--bg); border: 1px solid var(--line); }
.recap em { display: block; margin-top: 4px; color: var(--ink2); font-size: .9rem; }
.recap .chip { margin-left: 8px; }
.recap-clean { display: flex; align-items: center; gap: 8px; color: var(--good); font-weight: 600; }
.sum-main { font: 500 1.25rem var(--f-head); }
.sum-cols { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; margin: 14px 0; }
.sum-cols > div { padding: 12px; border-radius: 14px; background: var(--bg); border: 1px solid var(--line); }
.phrases { margin: 0 0 12px; padding-left: 20px; }

/* ------------------------------------------------------------- words */
.rv-start { text-align: center; padding: 18px 0; }
.big-num { font: 700 4.5rem/1 var(--f-head); color: var(--clay); }
.rv-progress { height: 8px; border-radius: 99px; background: var(--sand); overflow: hidden; margin-bottom: 8px; }
.rv-progress i { display: block; height: 100%; background: linear-gradient(90deg, var(--marigold), var(--clay)); transition: width .4s; }
.flash { width: 100%; min-height: 210px; display: grid; place-items: center; padding: 22px; border: 2px solid var(--line); border-radius: 24px; background: var(--bg); text-align: center; animation: pop .3s ease-out; }
.flash .back { display: none; } .flash.flip .front { display: none; } .flash.flip .back { display: grid; gap: 10px; }
.flash .front b { display: block; font: 700 2.4rem var(--f-head); }
.flash .front em { display: block; color: var(--ink2); margin-top: 2px; }
.flash .front small { display: block; margin-top: 16px; color: var(--ink2); }
.flash .back span { font-size: 1.15rem; } .flash .back q { font-size: 1.5rem; color: var(--ink2); quotes: none; }
.rv-row { display: flex; justify-content: center; margin: 12px 0; }
.grades { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
.g { border: 0; border-radius: 16px; padding: 12px 6px; font-weight: 700; color: #2B1810; transition: transform .15s; }
.g:hover { transform: translateY(-2px); } .g small { display: block; font-weight: 500; font-size: .72rem; opacity: .75; }
.g.again { background: var(--rose); } .g.hard { background: var(--ochre); } .g.good { background: var(--marigold); } .g.easy { background: var(--olive); color: #fff; }
.add-word, .fixform { display: flex; gap: 8px; margin-bottom: 10px; }
.add-word input, .fixform input, .search, .settings select, .settings input[type="text"] { flex: 1; width: 100%; padding: 11px 16px; border-radius: 999px; border: 1.5px solid var(--line); background: var(--bg); outline: none; }
.add-word input:focus, .fixform input:focus, .search:focus, .settings select:focus { border-color: var(--marigold); }
.search { margin-bottom: 8px; }
.wlist { list-style: none; margin: 0; padding: 0; max-height: 420px; overflow-y: auto; }
.wlist li { display: flex; justify-content: space-between; gap: 10px; padding: 10px 4px; border-bottom: 1px dashed var(--line); }
.wlist p { margin: 0; color: var(--ink2); font-size: .9rem; } .wlist em { color: var(--ink2); font-size: .85rem; }
.wl-r { display: flex; align-items: center; gap: 4px; flex: none; }
.wlist .none { color: var(--ink2); justify-content: center; }

/* -------------------------------------------------------- exercises */
.practice-card { min-height: 320px; }
.q-head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 6px; }
.q-text { font: 500 1.5rem/1.4 var(--f-head); margin: 10px 0 16px; }
.q-text.bad { color: var(--bad); } .q-label { color: var(--ink2); margin: 10px 0 0; }
.blank { display: inline-block; width: 90px; border-bottom: 3px solid var(--clay); margin: 0 4px; transform: translateY(2px); }
.opts { display: grid; gap: 10px; }
.opt { text-align: left; padding: 14px 18px; border-radius: 18px; border: 1.5px solid var(--line); background: var(--bg); font-size: 1.05rem; transition: transform .15s, border-color .2s, background .2s; }
.opt:hover:not(:disabled) { border-color: var(--marigold); transform: translateX(3px); }
.opt.right { background: color-mix(in srgb, var(--olive) 30%, var(--paper)); border-color: var(--olive); }
.opt.wrong { background: color-mix(in srgb, var(--clay) 25%, var(--paper)); border-color: var(--clay); }
.feedback { margin-top: 16px; padding: 14px 16px; border-radius: 18px; animation: pop .3s; }
.feedback.ok { background: color-mix(in srgb, var(--olive) 22%, var(--paper)); } .feedback.no { background: color-mix(in srgb, var(--clay) 16%, var(--paper)); }
.feedback .btn { display: flex; margin-top: 12px; }
.result { display: flex; gap: 26px; align-items: center; flex-wrap: wrap; }
.result .glass { width: 110px; flex: none; }
.glass { display: block; overflow: visible; } .glass-wave { animation: drift60 4s linear infinite; } .glass-wave.w2 { animation: drift60 6s linear infinite reverse; }
.revisit { list-style: none; padding: 0; margin: 8px 0 0; display: grid; gap: 8px; }
.revisit li { padding: 10px 12px; border-radius: 14px; background: var(--bg); border: 1px solid var(--line); }
.revisit span { display: block; color: var(--ink2); font-size: .9rem; }
.pron-sentence { font: 500 clamp(1.5rem, 3.4vw, 2.2rem)/1.4 var(--f-head); margin: 18px 0; }
.pw { border-radius: 6px; padding: 0 2px; cursor: pointer; transition: background .3s; } .pw:hover { background: var(--sand); }
.pw.ok { background: color-mix(in srgb, var(--olive) 30%, transparent); } .pw.miss { background: color-mix(in srgb, var(--clay) 30%, transparent); text-decoration: underline wavy var(--clay); }
.pron-result { margin-top: 18px; padding: 16px; border-radius: 20px; background: var(--bg); border: 1px solid var(--line); }
.score { display: flex; align-items: baseline; gap: 14px; } .score b { font: 700 2.6rem var(--f-head); color: var(--clay); }

/* ---------------------------------------------------------- progress */
.tiles { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 12px; margin-bottom: 18px; }
.tile { display: grid; gap: 2px; padding: 16px; border-radius: 22px; background: var(--paper); border: 1px solid var(--line); box-shadow: var(--shadow-s); }
.tile .ico { color: var(--clay); } .tile b { font: 700 2rem/1.1 var(--f-head); } .tile span { color: var(--ink2); font-size: .85rem; }
.bars { display: flex; align-items: flex-end; gap: 6px; height: 150px; margin: 14px 0 6px; }
.bar { flex: 1; display: grid; grid-template-rows: 1fr auto; justify-items: center; height: 100%; gap: 4px; }
.bar i { align-self: end; width: 100%; max-width: 26px; border-radius: 8px 8px 3px 3px; background: linear-gradient(180deg, var(--marigold), var(--clay)); transition: height .8s; }
.bar small { font-size: .68rem; color: var(--ink2); }
.hbars { list-style: none; margin: 10px 0 0; padding: 0; display: grid; gap: 10px; }
.hbars li { display: grid; grid-template-columns: 130px 1fr 28px; align-items: center; gap: 10px; font-size: .9rem; }
.hbars div { height: 12px; border-radius: 99px; background: var(--sand); overflow: hidden; } .hbars i { display: block; height: 100%; border-radius: 99px; }
.hbars b { text-align: right; }

/* ------------------------------------------------------------ modals */
.modal-backdrop { position: fixed; inset: 0; z-index: 80; display: grid; place-items: center; padding: 16px; background: rgba(43, 24, 16, .5); -webkit-backdrop-filter: blur(4px); backdrop-filter: blur(4px); opacity: 0; transition: opacity .2s; }
.modal-backdrop.in { opacity: 1; }
.modal { position: relative; width: min(94vw, 480px); max-height: 92dvh; overflow-y: auto; padding: 26px; border-radius: 30px; background: var(--paper); border: 1px solid var(--line); box-shadow: var(--shadow); transform: translateY(14px) scale(.98); transition: transform .25s; }
.modal-backdrop.in .modal { transform: none; }
.modal.wide { width: min(94vw, 640px); }
.modal .x { position: absolute; top: 12px; right: 14px; width: 38px; height: 38px; border-radius: 50%; border: 0; background: none; font-size: 1.6rem; line-height: 1; color: var(--ink2); }
.modal .x:hover { background: var(--sand); }
.modal-title { font-size: 1.5rem; padding-right: 36px; }
.modal-actions { display: flex; justify-content: flex-end; flex-wrap: wrap; gap: 10px; margin-top: 18px; }
.popover { position: fixed; z-index: 85; padding: 16px; border-radius: 20px; background: var(--paper); border: 1px solid var(--line); box-shadow: var(--shadow); opacity: 0; transform: translateY(6px); transition: opacity .18s, transform .18s; }
.popover.in { opacity: 1; transform: none; }
.wp-top { display: flex; align-items: center; gap: 10px; margin-bottom: 4px; } .wp-word { font: 700 1.4rem var(--f-head); }
.wp-mean { margin: 4px 0; } .wp-ex { margin: 4px 0 8px; color: var(--ink2); } .wp-actions { display: flex; gap: 8px; margin-top: 8px; }
#toasts { position: fixed; z-index: 100; left: 50%; bottom: calc(var(--dock) + 8px); transform: translateX(-50%); display: grid; gap: 8px; width: min(92vw, 460px); pointer-events: none; }
.toast { pointer-events: auto; padding: 12px 18px; border-radius: 18px; background: var(--ink); color: var(--bg); box-shadow: var(--shadow); opacity: 0; transform: translateY(10px); transition: all .3s; font-size: .95rem; cursor: pointer; }
.toast.in { opacity: 1; transform: none; } .toast.warn { background: var(--btn-bg); color: var(--btn-ink); }

/* voice pop-up */
.voice-pop { width: min(94vw, 440px); }
.vp-head { display: flex; gap: 12px; align-items: center; margin-bottom: 10px; } .vp-head h3 { margin: 0; font-size: 1.3rem; } .vp-head .sub { margin: 0; }
.vp-target { font: 500 1.3rem/1.4 var(--f-head); padding: 12px 14px; border-radius: 16px; background: color-mix(in srgb, var(--marigold) 20%, var(--paper)); margin: 8px 0; }
.vp-checks { list-style: none; margin: 10px 0; padding: 0; display: grid; gap: 6px; font-size: .92rem; }
.vp-checks li { display: flex; gap: 10px; align-items: flex-start; }
.vp-checks .dot { display: grid; place-items: center; width: 22px; height: 22px; border-radius: 50%; flex: none; font-weight: 700; background: var(--sand); }
.vp-checks .ok .dot { background: var(--olive); color: #fff; } .vp-checks .bad .dot { background: var(--clay); color: #fff; }
.vp-live { margin: 12px 0; padding: 12px; border-radius: 16px; background: var(--bg); border: 1px solid var(--line); }

function navigate(view, opts = {}) {
  if (!VIEWS.includes(view)) view = "today";
  if (current && current !== view) mounted[current].hide();
  current = view;
  $$(".view").forEach((v) => {
    const on = v.dataset.view === view;
    v.hidden = !on;
    v.classList.toggle("active", on);
  });
  $$("#dock [data-go]").forEach((b) => b.toggleAttribute("aria-current", b.dataset.go === view));
  history.replaceState(null, "", "#" + view);
  mounted[view].show(opts);
  window.scrollTo({ top: 0 });
}
var ctx = { navigate, openSettings };

  if (!appStarted) {

    mounted = {
      today: mountToday($("#view-today"), ctx),
      talk: mountChat($("#view-talk"), "talk", ctx),
      roleplay: mountChat($("#view-roleplay"), "roleplay", ctx),
      practice: mountPractice($("#view-practice")),
      words: mountWords($("#view-words")),
      progress: mountProgress($("#view-progress"), ctx)

    $("#dock").addEventListener("click", (e) => {

    });
    $("#brand").addEventListener("click", () => navigate("today"));
    $("#streakBtn").addEventListener("click", () => navigate("progress"));
    $("#settingsBtn").addEventListener("click", openSettings);
    $("#themeBtn").addEventListener("click", () => {
      setSetting("theme", settings.theme === "dark" ? "light" : "dark");
      applyTheme(settings.theme);
      if (current === "today") mounted.today.show();

    addEventListener("hashchange", () => {
      const v2 = location.hash.slice(1);
      VIEWS.includes(v2) && v2 !== current && navigate(v2);
    });
    subscribe((w) => w === "stats" && paintStreak());
    trackMinutes();
  }
  paintStreak();
  current = null;
  const v = location.hash.slice(1);
  navigate(VIEWS.includes(v) ? v : "today");
  let slow = null;
  wake(() => slow = toast("Cody is waking up. The free server naps when nobody is around, so the first message can take up to a minute.", { ms: 0 })).then((ok) => {
    slow?.();

}

function trackMinutes() {
  let last = Date.now(), acc = 0;

  setInterval(() => {
    if (document.hidden || Date.now() - last > 6e4 || !S.user) return;
    acc += 15;
    if (acc >= 120) {
      bump("secs", acc);
      acc = 0;
    }

  addEventListener("pagehide", () => {
    if (acc && S.user) {
      bump("secs", acc);
      acc = 0;

    flush();
  });
}
async function onUser(user) {

    stopApp();
    return showLogin();

    return;

document.addEventListener("pointerdown", (e) => {
  const b = e.target.closest(".btn, .google-btn, .door, .scn, .opt, .lv, .style");
  if (!b || b.disabled) return;
  const r = b.getBoundingClientRect(), s = document.createElement("span");
  s.className = "rip";
  s.style.left = e.clientX - r.left + "px";
  s.style.top = e.clientY - r.top + "px";
  b.appendChild(s);
  setTimeout(() => s.remove(), 700);
}, { passive: true });
if (!matchMedia("(prefers-reduced-motion: reduce)").matches && matchMedia("(hover: hover)").matches) {
  const LEAN = ".door, .scn, .tile, .lv, .style";
  document.addEventListener("pointermove", (e) => {
    const el = e.target.closest?.(LEAN);
    if (!el) return;
    el.classList.add("lean");
    const r = el.getBoundingClientRect();
    el.style.setProperty("--ry", ((e.clientX - r.left) / r.width - 0.5) * 7 + "deg");
    el.style.setProperty("--rx", (0.5 - (e.clientY - r.top) / r.height) * 7 + "deg");
    el.style.setProperty("--ty", "-3px");
  }, { passive: true });
  document.addEventListener("pointerout", (e) => {
    const el = e.target.closest?.(LEAN);
    if (!el || el.contains(e.relatedTarget)) return;
    ["--rx", "--ry", "--ty"].forEach((p) => el.style.removeProperty(p));
  }, { passive: true });
}
